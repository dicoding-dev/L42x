name: Pull Request Check
on: [pull_request]

jobs:
  unit-test:
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.6.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.23'
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.4.3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Installing dependencies
        env:
          COMPOSER_CACHE_DIR: /tmp/composer-cache
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Running unit test
        run: vendor/bin/phpunit --configuration phpunit.xml

  convergence-ratchet:
    name: Convergence ratchet (no new 4.2-only patterns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.6.0

      - name: Guard against new Laravel-4.2-only patterns
        run: bash ci/convergence-ratchet.sh src
